name: tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - name: Report numerical dependencies
        run: python -c "import sys, torch, numpy; print(sys.version); print('torch', torch.__version__, 'numpy', numpy.__version__)"
      - run: ruff check .
      - run: python -m pytest -q -ra -m 'not cuda and not crocoddyl'
      - run: python -m build
  crocoddyl-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,crocoddyl]'
      - name: Report reference dependencies
        run: |
          python -c "import sys, torch, numpy, pinocchio, crocoddyl; print(sys.version); print('torch', torch.__version__, 'numpy', numpy.__version__, 'pinocchio', pinocchio.__version__, 'crocoddyl', crocoddyl.__version__)"
      - run: python -m pytest -m crocoddyl -q -s
