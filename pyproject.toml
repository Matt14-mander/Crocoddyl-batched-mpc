[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crocoddyl-batched-mpc"
version = "0.1.0"
description = "Tensor-first batched MPC with Torch CPU/CUDA and a Crocoddyl CPU reference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
crocoddyl = ["crocoddyl>=2.1", "numpy>=1.24"]
dev = ["pytest>=8", "ruff>=0.6", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "cuda: requires a CUDA device",
    "crocoddyl: requires optional Crocoddyl bindings",
    "ddp_acceptance: executable DDP correctness acceptance gate",
    "m2_acceptance: M2 batched nonlinear MPC acceptance gate",
    "fddp_acceptance: feasibility-driven DDP and dynamic-gap acceptance gate",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".dev-tools", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I"]
